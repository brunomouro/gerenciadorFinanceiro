spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/gerenciadorFinanceiro}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    br.projetos.gerenciadorFinanceiro: TRACE

cors:
  originPatterns: http://localhost:8080,http://localhost:3000

file:
  upload-dir: ${UPLOAD_DIR}